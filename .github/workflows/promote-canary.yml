name: Promote Canary to Production
run-name: "🚦 Promoting Canary to Production (canary: ${{ inputs.canary }}, desired capacity: ${{ inputs.desired_production_capacity }})"

on:
  workflow_dispatch:
    inputs:
      canary:
        description: "Is this a canary deployment to promote?"
        required: true
        type: boolean
        default: true
      desired_production_capacity:
        description: "Desired capacity for production deployment"
        required: true
        type: number
        default: 2
      use_current_commit:
        description: "Use current commit SHA as version"
        required: true
        type: boolean
        default: true
      custom_version:
        description: "Custom version (only used if 'use_current_commit' is false)"
        required: false
        type: string

jobs:
  skip_non_canary:
    name: ⏭️ Skip Non-Canary Deployment
    runs-on: ubuntu-latest
    if: ${{ inputs.canary == false }}
    steps:
      - name: Skip Message
        run: |
          echo "⚠️ Canary input is set to false"
          echo "This workflow is designed to promote canary deployments only"
          echo "No actions will be performed"

  promote_canary_to_production:
    name: 🚦 Promote Canary to Production
    runs-on: ubuntu-latest
    if: ${{ inputs.canary == true }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        run: |
          if [ "${{ inputs.use_current_commit }}" == "true" ]; then
            VERSION="${{ github.sha }}"
            echo "Using current commit SHA as version: $VERSION"
          elif [ -n "${{ inputs.custom_version }}" ]; then
            VERSION="${{ inputs.custom_version }}"
            echo "Using custom version: $VERSION"
          else
            # Fallback: get current canary version from Terraform
            cd util/terraform/backend
            terraform init
            terraform workspace select canary
            VERSION=$(terraform output -raw canary_version || echo "")
            echo "Using current canary version from Terraform: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Final version to use: $VERSION"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Promote Canary Version
        uses: dflook/terraform-apply@v2
        with:
          workspace: canary
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/backend.tfvars
          variables: |
            ver="${{ steps.get_version.outputs.version }}"
            production_desired_capacity=${{ inputs.desired_production_capacity }}
            canary_enabled=false
          path: util/terraform/backend

      - name: Run Smoke Tests on Production
        run: |
          chmod +x ./util/scripts/backend/smoke-test.sh
          ./util/scripts/backend/smoke-test.sh https://canary-api.anyhasher.io

      - name: Promotion Success Summary
        run: |
          {
            echo "## ✅ Canary successfully promoted to production!"
            echo "- **Version:** ${{ steps.get_version.outputs.version }}"
            echo "- **Production capacity:** ${{ inputs.desired_production_capacity }}"
            echo "- **Production URL:** https://canary-api.anyhasher.io"
          } >> $GITHUB_STEP_SUMMARY