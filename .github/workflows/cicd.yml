# PLANNING STEPS:
# =====================
# Discover Changes
# Build Artifacts
# Deploy Artifacts
  # Deploy Frontend
  # Start Rolling Out Backend Instances (chain reaction)
    # Create Infrastructure
    # Apply Configuration
    # Install App
    # Test New Version
    # Add to Load Balancer
    # Kill One Old Instance
    # Repeat
  
name: Rolling Deployment CI/CD Pipeline
run-name: "🛠️ ${{ github.event.head_commit.message }} (${{ github.sha }})"
on:
  push: 
    branches:
      - rolling-deployments   #normally 'main'

jobs:
  
  ci-frontend:
    uses: ./.github/workflows/ci-frontend.yml
    with:
      ref: ${{ github.sha }}    

  ci-backend:
    uses: ./.github/workflows/ci-backend.yml
    with:
      ref: ${{ github.sha }}    
  
  cd-frontend:
    needs: ci-frontend
    uses: ./.github/workflows/cd-deploy-frontend.yml
    with: 
      ref: ${{ github.sha }}    
      backend_url: ${{ needs.cd-backend.outputs.backend_url }} #this will need to be a load balancer url
    secrets: inherit

  
# Set off chain reaction here, incrementing batch_id each time
# how will we know what the maximum batch_id is?
# backend deploy should include a "deregister" step for one instance
  cd-backend:
    needs: ci-backend
    uses: ./.github/workflows/cd-backend.yml
    with: 
      ref: ${{ github.sha }}  
      batch_id: 0
      batch_size: 1
      max_batch_id: 10
      target_loadbalancer: some_elb  
    secrets: inherit

# now, failure means rollback of any deployed instances and new frontend
  failure:
    needs: [cd-frontend, cd-backend]
    # We need some extra logic to prevent cleanup when a CI failure
    if: |
      failure() && (
        needs.start-backend-rollout.result != 'skipped' ||
        needs.deploy-frontend.result != 'skipped'    
      ) 
    uses: ./.github/workflows/cleanup.yml
    with: 
      ref: ${{ github.sha }}
      env_name: Green
      reason: failure
    secrets: inherit