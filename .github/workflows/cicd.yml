# PIPELINE FLOW:
# =====================
# 1. Detect changes in frontend/backend code or workflows
# 2. Build frontend and backend artifacts (CI)
# 3. Upload backend artifact to S3
# 4. Deploy backend (canary or rolling) with Terraform
# 5. Deploy frontend to S3 and update backend URL
# 6. Wait for backend health checks (ALB)
# 7. Run smoke tests for backend and frontend
# 8. Rollback automatically if health/smoke tests fail
# 9. Optionally promote canary to production manually
# 10. Summarize deployment or rollback results

name: Canary Deployment CI/CD Pipeline
run-name: "🛠️ ${{ github.event.head_commit.message }} (${{ github.sha }})"
on:
  push:
    branches:
      # - main
      - canary-deployment #normally 'main'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          base: ${{ github.event.before }}
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-frontend.yml'
              - '.github/workflows/cd-frontend.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci-backend.yml'
              - '.github/workflows/cd-backend.yml'

  ci-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml
    with:
      ref: ${{ github.sha }}

  ci-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
    with:
      ref: ${{ github.sha }}

  cd-frontend:
    needs: ci-frontend
    uses: ./.github/workflows/cd-frontend.yml
    with:
      ref: ${{ github.sha }}
      backend_url: canary-api.anyhasher.io
    secrets: inherit

  cd-backend:
    needs: ci-backend
    uses: ./.github/workflows/cd-backend.yml
    with:
      version: ${{ github.sha }}
      canary: true
      canary_percentage: 20
      canary_desired_capacity: 2
      production_desired_capacity: 2
    secrets: inherit
