# PLANNING STEPS:
# =====================
# Discover Changes
# Build Artifacts
# Deploy Artifacts
# Deploy Frontend
# Start Rolling Out Backend Instances (chain reaction)
# Create Infrastructure
# Apply Configuration
# Install App
# Test New Version
# Add to Load Balancer
# Kill One Old Instance
# Repeat

name: Rolling Deployment CI/CD Pipeline
run-name: "🛠️ ${{ github.event.head_commit.message }} (${{ github.sha }})"
on:
  push:
    branches:
      # - main #to avoid executions for now
      - rolling-deployments #normally 'main'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          base: HEAD-1
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  ci-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml
    with:
      ref: ${{ github.sha }}

  ci-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
    with:
      ref: ${{ github.sha }}

  cd-frontend:
    needs: [detect-changes, ci-frontend]
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/cd-frontend.yml
    with:
      ref: ${{ github.sha }}
      backend_url: api.anyhasher.io
    secrets: inherit

  cd-backend:
    needs: [detect-changes, ci-backend]
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/cd-backend.yml
    with:
      version: ${{ github.sha }}
    secrets: inherit
