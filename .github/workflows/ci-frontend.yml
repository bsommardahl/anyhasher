name: CI Frontend
run-name: "Building Frontend Artifact (${{ inputs.ref }})"
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  fe-build:
    name: 🛠️ Build Frontend Artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: fe-node-${{ inputs.ref }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Clean npm cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm cache clean --force

      - name: Install Deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd frontend && npm ci

      - name: Build
        run: |
          cd frontend && npm run build

      - name: Store Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact-${{ inputs.ref }}
          path: frontend/build

  fe-security-audit:
    name: 🛡️ Audit Frontend Packages for Security Vulnerabilities
    needs: [fe-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: fe-node-${{ inputs.ref }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Clean npm cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm cache clean --force

      - name: Install Deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd frontend && npm i

      - name: Check for security issue
        run: cd frontend && npm audit --omit=dev --audit-level=critical

  fe-static-analysis:
    name: 🔬 Run Static Analysis on Frontend Code
    needs: [fe-build]
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          config-file: ./.github/codeql/codeql.config.yml
          languages: javascript

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: fe-node-${{ inputs.ref }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Clean npm cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm cache clean --force

      - name: Install Deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd frontend && npm i

      - name: Build
        run: cd frontend && npm run build

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

