# PLANNING STEPS:
# =====================
# Discover Changes
# Build Artifacts
# Deploy Artifacts
  # Deploy Frontend
  # Start Rolling Out Backend Instances (chain reaction)
    # Create Infrastructure
    # Apply Configuration
    # Install App
    # Test New Version
    # Add to Load Balancer
    # Kill One Old Instance
    # Repeat
  
name: Build and deploy the frontend
run-name: "🛠️ ${{ github.event.head_commit.message }} (${{ github.sha }})"
on:
  push: 
    branches:
      - rolling-deployments   #normally 'main'

jobs:
  
  

  # now, failure means rollback of any deployed instances and new frontend
  failure:
    needs: [deploy-frontend]
    # We need some extra logic to prevent cleanup when a CI failure
    if: |
      failure() && (
        needs.deploy-frontend.result != 'skipped'
      ) 
    uses: ./.github/workflows/cleanup.yml
    with: 
      ref: ${{ github.sha }}
      env_name: Green
      reason: failure
    secrets: inherit