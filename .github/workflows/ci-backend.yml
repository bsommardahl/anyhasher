name: CI Backend
run-name: "Building Backend Artifact (${{ inputs.ref }})"
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  be-build:
    name: 🛠️ Build Backend Artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: be-node-${{ hashFiles('backend/package-lock.json') }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install Deps
        run: cd backend && npm ci

      - name: Build
        run: cd backend && npm run build

      - name: Store Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact-${{ inputs.ref }}
          path: backend/build/

      - name: Create Compressed Artifact
        run: cd backend && tar -czf backend-artifact-${{ inputs.ref }}.tar.gz -C build .

      - name: Store Compressed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact-compressed-${{ inputs.ref }}
          path: backend/backend-artifact-${{ inputs.ref }}.tar.gz

  be-lint:
    name: 🕵️ Lint Backend Code
    needs: [be-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: be-node-${{ hashFiles('backend/package-lock.json') }}

      - name: Clean npm cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm cache clean --force

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd backend && npm i

      - name: Lint the code
        run: cd backend && npm run lint

  be-test:
    name: 🧪 Backend Unit Tests
    needs: [be-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: be-node-${{ hashFiles('backend/package-lock.json') }}

      - name: Clean npm cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm cache clean --force

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd backend && npm i

      - name: Run Unit Tests
        run: cd backend && npm t

  be-security-audit:
    name: 🛡️ Audit Backend Packages for Security Vulnerabilities
    needs: [be-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for security issue
        run: cd backend && npm audit --omit=dev --audit-level=high

  be-static-analysis:
    name: 🔬 Run Static Analysis on Backend Code
    needs: [be-build]
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          config-file: ./.github/codeql/codeql.config.yml
          languages: javascript

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: be-node-${{ hashFiles('backend/package-lock.json') }}

      - name: Clean npm cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm cache clean --force

      - name: Install Deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: cd backend && npm i

      - name: Build
        run: cd backend && npm run build

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

