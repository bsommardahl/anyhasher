name: Deploy Frontend
run-name: "🚛 CD: Deploying Frontend Artifact (${{ inputs.ref }})"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      backend_url:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
    outputs:
      frontend_url:
        value: ${{ jobs.provision.outputs.frontend_url }}

jobs:
  provision:
    name: 🏛️ Provision Frontend Infrastructure
    outputs:
      frontend_url: ${{ steps.provision.outputs.website_endpoint }}
      bucket_name: ${{ steps.provision.outputs.bucket_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Frontend Infrastructure
        id: provision
        uses: dflook/terraform-apply@v2
        with:
          workspace: prod
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/frontend.tfvars
          path: util/terraform/frontend
          variables: |
            ver = "${{ inputs.ref }}"

  deploy:
    name: 🚚 Deploy Frontend to S3
    needs: [provision]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create Rollback Backup
        run: |
          echo "📦 Creating backup of current frontend version..."
          chmod +x util/scripts/download-front-rollback.sh
          ./util/scripts/download-front-rollback.sh
        continue-on-error: true

      - name: Upload Rollback Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-frontend-${{ inputs.ref }}
          path: rollback-backup/
          retention-days: 7
        continue-on-error: true

      - name: Get Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-artifact-${{ inputs.ref }}
          path: frontend/build

      - name: Replace Backend URL
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: http://localhost:5001
          replace: https://${{ inputs.backend_url }}
          include: "frontend/build/**/*.js"
          regex: false

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/ s3://${{ needs.provision.outputs.bucket_name }} --delete
          aws s3 cp frontend/build/index.html s3://${{ needs.provision.outputs.bucket_name }}/index.html --cache-control "no-cache"
