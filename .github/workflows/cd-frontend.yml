name: Deploy Frontend
run-name: "🚛 CD: Deploying Frontend Artifact (${{ inputs.ref }})"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      backend_url:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
    outputs:
      frontend_url:
        value: ${{ jobs.provision.outputs.frontend_url }}

jobs:
  provision:
    name: 🏛️ Provision Frontend Infrastructure
    outputs:
      frontend_url: http://${{ steps.provision.outputs.website_endpoint }}
      bucket_name: ${{ steps.provision.outputs.bucket_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Frontend Infrastructure
        id: provision
        uses: dflook/terraform-apply@v2
        with:
          workspace: prod
          auto_approve: true
          path: util/terraform/frontend
          variables: |
            aws_region = "us-east-1"
            environment = "prod"
            ver = "${{ inputs.ref }}"

  deploy:
    name: 🚚 Deploy Frontend to S3
    needs: [provision]
    runs-on: ubuntu-latest
    steps:
      - name: Get Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-artifact-${{ inputs.ref }}
          path: frontend/build

      - name: Replace Backend URL
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: http://localhost:5001
          replace: https://${{ inputs.backend_url }}
          include: "frontend/build/**/*.js"
          regex: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/ s3://${{ needs.provision.outputs.bucket_name }} --delete
          aws s3 cp frontend/build/index.html s3://${{ needs.provision.outputs.bucket_name }}/index.html --cache-control "no-cache"

  verify:
    name: 🧪 Smoke Test Frontend
    needs: [provision, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run E2E Smoke Test
        uses: mujo-code/puppeteer-headful@v2
        with:
          args: |
            cd frontend/e2e
            npm install
            TEST_URL=${{ needs.provision.outputs.frontend_url }} npm run smoke
