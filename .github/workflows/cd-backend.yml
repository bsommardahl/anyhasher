name: Deploy new version of backend
run-name: "🚛 CD: Rolling Out New Backend Version (${{ inputs.version }})"

on:
  workflow_call:
    inputs:
      version:
        description: "The version of this deployment (ex: git commit sha)"
        required: true
        type: string

jobs:
  upload_artifact:
    name: 📦 Upload Artifact to S3
    runs-on: ubuntu-latest
    outputs:
      s3_bucket: ${{ steps.upload.outputs.s3_bucket }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact-compressed-${{ inputs.version }}
          path: ./

      - name: Upload to S3
        id: upload
        run: |
          chmod +x ./util/scripts/backend/upload-to-s3.sh
          ./util/scripts/backend/upload-to-s3.sh "${{ inputs.version }}"

  deploy:
    name: 🚀 Rolling Deployment
    needs: upload_artifact
    runs-on: ubuntu-latest
    outputs:
      target_group_arn: ${{ steps.apply_changes.outputs.target_group_arn }}
      previous_version: ${{ steps.apply_changes.outputs.previous_version }}
      previous_desired_capacity: ${{ steps.apply_changes.outputs.previous_desired_capacity }}
      asg_name: ${{ steps.apply_changes.outputs.asg_name }}
      desired_capacity: ${{ steps.apply_changes.outputs.desired_capacity }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Apply Rolling Deployment
        id: apply_changes
        uses: dflook/terraform-apply@v2
        with:
          workspace: prod
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/backend.tfvars
          variables: |
            ver="${{ inputs.version }}"
            desired_capacity=2
            min_healthy_percentage=50
            checkpoint_wait=300
          path: util/terraform/backend

  wait_for_health:
    name: 🩺 Health Check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Wait for ALB Health Checks
        run: |
          chmod +x ./util/scripts/backend/wait-for-alb.sh
          ./util/scripts/backend/wait-for-alb.sh "${{ needs.deploy.outputs.target_group_arn }}" "${{ inputs.version }}"

  rollback:
    name: 🔄 Rollback
    needs: [deploy, wait_for_health]
    if: failure() && needs.wait_for_health.result == 'failure' && needs.deploy.outputs.previous_version != 'first-deployment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Rollback to previous version
        uses: dflook/terraform-apply@v2
        with:
          workspace: prod
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/backend.tfvars
          variables: |
            ver="${{ needs.deploy.outputs.previous_version }}"
            desired_capacity=${{ needs.deploy.outputs.previous_desired_capacity }}
          path: util/terraform/backend

      - name: Rollback Summary
        run: |
          chmod +x util/scripts/backend/rollback-summary.sh
          ./util/scripts/backend/rollback-summary.sh "${{ inputs.version }}" "${{ needs.deploy.outputs.previous_version }}" "${{ needs.deploy.outputs.asg_name }}" "${{ needs.deploy.outputs.previous_desired_capacity }}" "${{ needs.deploy.outputs.target_group_arn }}"

  smoke_test:
    name: 🧪 Smoke Test
    needs: [deploy, wait_for_health, rollback]
    if: always() && (needs.wait_for_health.result == 'success' || needs.rollback.result == 'success')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Smoke Tests
        run: |
          chmod +x ./util/scripts/backend/smoke-test.sh
          ./util/scripts/backend/smoke-test.sh https://api.anyhasher.io

      - name: Deployment Success Summary
        if: needs.rollback.result != 'success'
        run: |
          chmod +x util/scripts/backend/deployment-success-summary.sh
          ./util/scripts/backend/deployment-success-summary.sh "${{ inputs.version }}" "https://api.anyhasher.io"
