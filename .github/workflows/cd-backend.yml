name: Deploy new version of backend
run-name: "🚛 CD: Rolling Out New Backend Version (${{ inputs.version }})"

on:
  workflow_call:
    inputs:
      version:
        description: "The version of this deployment (ex: git commit sha)"
        required: true
        type: string
      active_environment:
        description: "Target environment for deployment (blue or green)"
        required: true
        type: string
      desired_capacity:
        description: "Desired capacity for the deployment (default: 2)"
        required: true
        type: number
        default: 2

jobs:
  upload_artifact:
    name: 📦 Upload Artifact to S3
    runs-on: ubuntu-latest
    outputs:
      s3_bucket: ${{ steps.upload.outputs.s3_bucket }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact-compressed-${{ inputs.version }}
          path: ./

      - name: Upload to S3
        id: upload
        run: |
          chmod +x ./util/scripts/backend/upload-to-s3.sh
          ./util/scripts/backend/upload-to-s3.sh "${{ inputs.version }}"

  deploy:
    name: 🚀 Blue/Green Deployment
    needs: upload_artifact
    runs-on: ubuntu-latest
    outputs:
      target_group_arn: ${{ steps.apply_bluegreen.outputs.target_group_arn }}
      asg_name: ${{ steps.apply_bluegreen.outputs.asg_name }}
      previous_version: ${{ steps.apply_bluegreen.outputs.previous_version }}
      previous_desired_capacity: ${{ steps.apply_bluegreen.outputs.previous_desired_capacity }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Apply Blue/Green Deployment
        id: apply_bluegreen
        run: |
          chmod +x ./util/scripts/backend/run-bluegreen-deploy-pipeline.sh
          ./util/scripts/backend/run-bluegreen-deploy-pipeline.sh "${{ inputs.version }}" "${{ inputs.desired_capacity }}" "${{ inputs.active_environment }}"

  wait_for_health:
    name: 🩺 Health Check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Wait for ALB Health Checks
        run: |
          chmod +x ./util/scripts/backend/wait-for-alb.sh
          ./util/scripts/backend/wait-for-alb.sh "${{ needs.deploy.outputs.target_group_arn }}" "${{ inputs.version }}"

  rollback:
    name: 🔄 Rollback
    needs: [deploy, wait_for_health]
    if: failure() && needs.wait_for_health.result == 'failure' && needs.deploy.outputs.previous_version != 'first-deployment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Rollback to previous version
        if: ${{ !inputs.decoupled }}
        uses: dflook/terraform-apply@v2
        with:
          workspace: decoupled
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/backend.tfvars
          variables: |
            ver="${{ needs.deploy.outputs.previous_version }}"
            production_desired_capacity=${{ needs.deploy.outputs.previous_production_desired_capacity }}
          path: util/terraform/backend

      - name: Rollback decoupled Deployment
        if: ${{ inputs.decoupled }}
        run: |
          cd util/terraform/backend
          chmod +x ../../scripts/backend/decoupled-safe-deploy.sh
          ../../scripts/backend/decoupled-safe-deploy.sh "${{ needs.deploy.outputs.previous_version }}" "${{ needs.deploy.outputs.previous_canary_percentage }}" "${{ needs.deploy.outputs.previous_canary_desired_capacity }}" "${{ needs.deploy.outputs.previous_production_desired_capacity }}"

      - name: Rollback Summary
        run: |
          chmod +x util/scripts/backend/rollback-summary.sh
          ./util/scripts/backend/rollback-summary.sh "${{ inputs.version }}" "${{ needs.deploy.outputs.previous_version }}" "${{ needs.deploy.outputs.asg_name }}" "${{ needs.deploy.outputs.previous_production_desired_capacity }}" "${{ needs.deploy.outputs.previous_decoupled_desired_capacity }}" "${{ needs.deploy.outputs.target_group_arn }}"

  promote_to_production:
    name: 🔥 Promote to Production Traffic
    needs: [deploy, wait_for_health]
    if: success() && needs.wait_for_health.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Switch Traffic to New Environment
        uses: dflook/terraform-apply@v2
        with:
          workspace: decoupled
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/backend.tfvars
          variables: |
            active_environment=${{ inputs.active_environment }}
          path: util/terraform/backend

  smoke_test:
    name: 🧪 Smoke Test
    needs: [rollback, promote_to_production]
    if: always() && (needs.wait_for_health.result == 'success' || needs.rollback.result == 'success')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Smoke Tests
        run: |
          chmod +x ./util/scripts/backend/smoke-test.sh
          ./util/scripts/backend/smoke-test.sh https://decoupled-api.anyhasher.io

      - name: Deployment Success Summary
        if: needs.rollback.result != 'success'
        run: |
          chmod +x util/scripts/backend/deployment-success-summary.sh
          ./util/scripts/backend/deployment-success-summary.sh "${{ inputs.version }}" "https://decoupled-api.anyhasher.io"
