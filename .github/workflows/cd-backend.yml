name: Deploy new version of backend
run-name: "🚛 CD: Rolling Out New Backend Version (${{ inputs.version }})"

on:
  workflow_call:
    inputs:
      version:
        description: "The version of this deployment (ex: git commit sha)"
        required: true
        type: string

jobs:
  provision:
    name: 🏗️ Provision Infrastructure
    runs-on: ubuntu-latest
    outputs:
      target_group_arn: ${{ steps.apply_changes.outputs.target_group_arn }}
      previous_version: ${{ steps.apply_changes.outputs.previous_version }}
      asg_name: ${{ steps.apply_changes.outputs.asg_name }}
      desired_capacity: ${{ steps.apply_changes.outputs.desired_capacity }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Apply Infra Code
        id: apply_changes
        uses: dflook/terraform-apply@v2
        with:
          workspace: prod
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/backend.tfvars
          variables: |
            ver="${{ inputs.version }}"
          path: util/terraform/backend

  configure:
    name: ⚙️ Configure Backend
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact-${{ inputs.version }}
          path: backend/build/

      - name: Fetch EC2 Hosts
        run: |
          chmod +x ./util/scripts/fetch-ec2-by-tag.sh
          ./util/scripts/fetch-ec2-by-tag.sh "prod-${{ inputs.version }}"

      - name: Configure Backends
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: deploy.yml
          directory: ./util/ansible
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          options: |
            --verbose
            --inventory ./inventory/hosts

  wait_for_health:
    name: 🩺 Health Check
    needs: [configure, provision]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Wait for ALB Health Checks
        run: |
          chmod +x ./util/scripts/wait-for-alb.sh
          ./util/scripts/wait-for-alb.sh "${{ needs.provision.outputs.target_group_arn }}" "${{ inputs.version }}"

  rollback:
    name: 🔄 Rollback
    needs: [provision, configure, wait_for_health]
    if: failure() && (needs.configure.result == 'failure' || needs.wait_for_health.result == 'failure') && needs.provision.outputs.previous_version != 'first-deployment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Rollback to previous version
        uses: dflook/terraform-apply@v2
        with:
          workspace: prod
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/backend.tfvars
          variables: |
            ver="${{ needs.provision.outputs.previous_version }}"
            desired_capacity=${{ needs.provision.outputs.desired_capacity }}
            deployment_phase="rollback"
          path: util/terraform/backend

      - name: Rollback Summary
        shell: bash
        run: |
          echo "## 🔄 Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Deployment failed and rollback was triggered" >> $GITHUB_STEP_SUMMARY
          echo "- 🔙 Rolled back from: \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Rolled back to: \`${{ needs.provision.outputs.previous_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Infrastructure restored successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Rollback Details" >> $GITHUB_STEP_SUMMARY
          echo "- **ASG Name**: ${{ needs.provision.outputs.asg_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Desired Capacity**: ${{ needs.provision.outputs.desired_capacity }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Group**: ${{ needs.provision.outputs.target_group_arn }}" >> $GITHUB_STEP_SUMMARY

  rolling:
    name: 🔄 Rolling Deploy
    needs: wait_for_health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Apply rolling deployment
        uses: dflook/terraform-apply@v2
        with:
          workspace: prod
          auto_approve: true
          var_file: |
            util/terraform/environments/prod/backend.tfvars
          variables: |
            ver="${{ inputs.version }}"
            deployment_phase="rolling"
          path: util/terraform/backend

  smoke_test:
    name: 🧪 Smoke Test
    needs: rolling
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Smoke Tests
        run: |
          chmod +x ./util/scripts/smoke-test.sh
          ./util/scripts/smoke-test.sh https://api.anyhasher.io

      - name: Deployment Success Summary
        shell: bash
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Infrastructure provisioned successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend configured with Ansible" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Health checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Rolling deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Smoke tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint**: https://api.anyhasher.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Type**: Rolling Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
