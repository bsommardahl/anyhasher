---
- name: Copy feature flags file to remote
  ansible.builtin.copy:
    src: "../../.feature-flags"
    dest: "/tmp/.feature-flags"
    mode: '0644'

- name: Read feature flags from file
  ansible.builtin.slurp:
    src: "/tmp/.feature-flags"
  register: flags_file

- name: Parse feature flags into variables
  ansible.builtin.set_fact:
    feature_flags: "{{ feature_flags | default({}) | combine({ item.split('=')[0]: item.split('=')[1] }) }}"
  loop: "{{ (flags_file['content'] | b64decode).splitlines() }}"
  when: item and '=' in item

- name: Ensure feature flags are present in /etc/environment
  ansible.builtin.lineinfile:
    dest: /etc/environment
    state: present
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}="{{ item.value }}"'
  loop: "{{ feature_flags | dict2items }}"
  become: yes

- name: Reload systemd and restart service
  ansible.builtin.systemd:
    name: pm2-ubuntu.service
    daemon_reload: true
    state: restarted
  become: yes