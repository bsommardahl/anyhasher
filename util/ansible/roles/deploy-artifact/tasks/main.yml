---
- name: Deploy Backend Artifact
  synchronize: # "copy" takes too long!
    src: "../../backend/build"
    dest: ~/anyhasher

- name: Copy feature flags file to remote
  ansible.builtin.copy:
    src: "../../.feature-flags"
    dest: "~/anyhasher/build/.env"
    mode: '0644'

- name: Start Server
  shell: "cd ~/anyhasher/build && pm2 start server.js"
