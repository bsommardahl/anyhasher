---
- name: Deploy Backend Artifact
  synchronize: # "copy" takes too long!
    src: "../../backend/build"
    dest: ~/anyhasher

- name: Stop existing server (if running)
  shell: "pm2 delete server || true"
  ignore_errors: yes

- name: Start Server
  shell: "cd ~/anyhasher/build && pm2 start server.js"
